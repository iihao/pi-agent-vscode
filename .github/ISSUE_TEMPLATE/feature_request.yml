name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Any alternatives you considered?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
