name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run compile
      - name: Package (smoke check)
        run: npx --yes @vscode/vsce package --out pi-agent.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: pi-agent.vsix
          if-no-files-found: error
